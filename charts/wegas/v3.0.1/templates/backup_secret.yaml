{{- if and .Values.backup.enabled (not .Values.backup.existingSecret) }}
apiVersion: v1
kind: Secret
type: Opaque
stringData:
  S3_backup_key: {{ .Values.backup.s3.key | default "" | quote }}
  S3_backup_secret: {{ .Values.backup.s3.secret | default "" | quote }}
  backup_encryption_password: {{ .Values.backup.s3.backup_encryption_password | default "" | quote }}
metadata:
  name: {{ template "wegas.fullname" . }}-backup-secret
  labels:
    app: {{ template "wegas.fullname" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
{{- end }}
