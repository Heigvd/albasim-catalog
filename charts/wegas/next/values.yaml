ingress:
  enabled: false
  hostname: null
wegas:
  replicas: 1
  # Key: wegas.properties
  existingPropertiesSecret: ""
  payaratag: latest
  java_heap: '1500'
  cpuRequest: 500m
  cpuLimit: 1800m
  memLimit: 3800Mi
  nbpopulators: 3
  nbthreads: 9
  docker:
    image: 'ghcr.io/heigvd/wegas-next'
    tag: latest
  wegas_properties: |
    favicon=favicon_black
    pusher.appId=
    pusher.key=
    pusher.secret=
    pusher.cluster=eu
    pusher.onlineusers_hook=true
    #
    # SMTP
    #######
    mail.default_domain=
    mail.smtp.starttls.enable=true
    mail.smtp.host=
    mail.smtp.username=
    mail.smtp.password=
    mail.smtp.auth=true
    mail.smtp.port=587
    
    # DeepL PRO API
    ###########################################3
    deepl.service_url=
    deepl.auth_key=
    deepl.enabled=false

    #######
    # EduID
    ##############
    eduid.enabled=false
    eduid.url=

    # Shiro
    #######
    shiro.secureFlag=true
    shiro.cipherKey=
db:
  name: wegas_dev
  user: user
  password: "1234"        # ignored when existingSecret is set
  # Key: DB_PASSWORD
  existingSecret: ""
  useExistingClaim: false
  existingClaim: ""
  size: 10Gi
mongo:
  useExistingClaim: false
  existingClaim: ""
  size: 10Gi
backup:
  enabled: false
  suspend: false
  # Keys: S3_backup_key, S3_backup_secret, backup_encryption_password
  existingSecret: ""
  # Must already exist in the namespace. Defaults to the name ghcr-pull-secret.
  imagePullSecretName: ""
  s3:
    key:
    secret:
    bucket:
    rclone_type:
    rclone_provider:
    rclone_endpoint:
    backup_encryption_password: