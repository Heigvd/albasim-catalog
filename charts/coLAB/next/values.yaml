# Keys: COLAB_DATABASE_PASSWORD, COLAB_DEFAULT_ADMIN_PASSWORD
existingSecret: ""
ingress:
  enabled: true
  hostname: "hostname"
colab:
  image_tag: 
  # Key: colab.properties
  existingPropertiesSecret: ""
  replicas: 1
  java_heap: 500
  memRequest: 500Mi
  cpuRequest: 500m
  min_threads: 
  max_threads: 
  gc: 'G1GC'
  smtp:
    domain: "colab.local"
    auth: true
    username: ""
    password: ""
    host: ""
    port: 587
    starttls: true
  admin:
    username: admin
    password: admin        # ignored when existingSecret is set
    email: admin@colab.local
  jcr:
    quota_mo: 512
    maxfile_size_mo: 20
  extraproperties: |
    colab.localaccount.showcreatebutton=false
db:
  name: colab
  user: colab
  password: colab          # ignored when existingSecret is set
  useExistingClaim: false
  existingClaim: ""
  size: 10Gi
mongo:
  useExistingClaim: false
  existingClaim: ""
  size: 10Gi
backup:
  enabled: false
  suspend: false
  # Keys: S3_backup_key, S3_backup_secret, backup_encryption_password
  existingSecret: ""
  # Must already exist in the namespace. Defaults to the name ghcr-pull-secret.
  imagePullSecretName: ""
  s3:
    key:
    secret:
    bucket:
    rclone_type:
    rclone_provider:
    rclone_endpoint:
    backup_encryption_password: